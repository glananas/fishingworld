function toNet2(id){const i=S.store.findIndex(c=>c.id===id);if(i<0)return;if(S.net.length>=CFG.netCap)return toast("Садок полон.");const c=S.store.splice(i,1)[0];if(!have(c.id))S.net.push(c);save();render()}
function appraise(){[...S.net,...S.store].forEach(c=>c.ap=1);save();toast("Улов оценён");render()}
/* ===== Экономика ===== */
function buy(id){const it=I[id];if(!it||S.own[id])return toast("Уже куплено.");if(S.lv<it.lv)return toast("Нужен уровень "+it.lv);if(S.m<it.p)return toast("Не хватает денег.");S.m-=it.p;S.own[id]=1;save();toast("Куплено: "+it.n);render()}
function buyB(id){const b=BT[id];if(!b)return;if(S.lv<b.lv)return toast("Нужен уровень "+b.lv);if(!b.nat&&S.bt[id])return toast("У тебя уже есть эта приманка.");if(S.m<b.p)return toast("Не хватает денег.");S.m-=b.p;S.bt[id]=(S.bt[id]||0)+(b.nat?b.pack:1);save();toast("Куплено: "+b.n);render()}
function equip(t,id){if(t==="b"?!(S.bt[id]>0):!S.own[id])return toast("Этого нет в запасе.");S.eq[t]=id;save();render()}
function sell(ids){let tot=0,n=0;for(const id of ids){let a=S.net,i=a.findIndex(c=>c.id===id);if(i<0){a=S.store;i=a.findIndex(c=>c.id===id)}if(i<0)continue;tot+=price(a[i]);a.splice(i,1);n++}
 if(!n)return toast("Нечего продавать.");S.m+=tot;S.st.sold+=tot;S.sel=S.sel.filter(i=>have(i));save();toast(`Продано: ${n} шт. за ${tot}`);render()}
function openLoc(id){const L=LOC[id];if(S.ul[id])return setLoc(id);if(S.lv<L.lv)return toast("Нужен уровень "+L.lv);if(S.m<L.cost)return toast("Не хватает денег.");S.m-=L.cost;S.ul[id]=1;save();toast("Открыто: "+L.n);setLoc(id)}
function setLoc(id){if(!S.ul[id])return;S.loc=id;G.pt=null;G.mapOpen=1;save();toast("Место: "+LOC[id].n);render()}
function claim(id){const q=QS.find(x=>x.id===id);if(!q||S.q[id]||q.g(S)<q.need)return;S.q[id]=1;S.m+=q.rw;save();toast("Награда: "+q.rw);render()}
/* ===== UI ===== */
const TABS=[["fish","Ловля"],["loc","Места"],["gear","Снасти"],["shop","Лавка"],["net","Садок"],["quest","Задачи"],["prof","Я"]];
function go(t){if(G.ph==="fight")return toast("Идёт вываживание!");reset();tab=t;render()}
function statsLine(it){const e=eqi(it.t);return Object.keys(it.s).map(k=>{const d=fx(it.s[k]-e.s[k]);return `<span class="chip">${ST[k]} ${it.s[k]}${it.id!==e.id&&d?` <span class="${d>0?"up":"dn"}">(${d>0?"+":""}${d})</span>`:""}</span>`}).join("")}
function itemCard(it,mode){const own=S.own[it.id],eq=S.eq[it.t]===it.id;
 return `<div class="card"><div class="it">${ico(it)}<div style="flex:1"><div class="row"><b>${it.n}</b><span class="mu">${it.p?M(it.p):"стартовый"}</span></div><div>${statsLine(it)}</div></div></div><div class="row" style="margin-top:6px"><span class="mu">Ур. ${it.lv}</span>${mode==="shop"?(own?'<span class="up">Куплено</span>':`<button class="btn" onclick="buy('${it.id}')" ${S.lv<it.lv||S.m<it.p?"disabled":""}>Купить</button>`):(eq?'<span class="up">Экипировано</span>':`<button class="btn s" onclick="equip('${it.t}','${it.id}')">Экипировать</button>`)}</div></div>`}
const pv=c=>c.ap?M(price(c)):"—";
const fr=c=>`<b>${FISH[c.f].n}</b> ${c.w} кг <span class="mu">${CN[c.cat!=null?c.cat:catOf(c.f,c.w)]}</span>`;
function openMap(){if(G.ph!=="idle")return toast("Сначала закончи рыбалку.");G.mapOpen=1;render()}
function stage(L,e){const f=fpos(),ph=G.ph,n=e.night,fl=ph==="fight"||ph==="idle"?' opacity="0"':"";
 return `<svg viewBox="0 0 360 250" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.sk[0]}"/><stop offset="1" stop-color="${L.sk[1]}"/></linearGradient><linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.sk[2]}"/><stop offset="1" stop-color="${L.sk[3]}"/></linearGradient></defs>
<rect width="360" height="110" fill="url(#sk)"/><circle cx="70" cy="40" r="${n?10:15}" fill="${n?"#eef2ff":"#fff3c4"}" opacity=".9"/>
<path d="M0 108V78l20-18 22 20 26-26 28 24 30-20 26 22 30-28 32 26 24-18 22 20V108z" fill="${L.sk[4]}" opacity=".6"/><path d="M0 108V90l30-14 28 16 34-20 30 18 40-16 36 16 40-12 34 14 28-8V108z" fill="${L.sk[4]}"/>
<rect y="108" width="360" height="142" fill="url(#wt)"/>${[0,1,2,3,4,5].map(i=>`<path d="M${20+i*50} ${120+i*20}h${60-i*5}" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>`).join("")}
<path d="M0 250V210q10-30 6-60M14 250q-6-30 4-70M26 250q4-20-2-50" stroke="#16341f" stroke-width="3" fill="none"/><path d="M352 250L236 40" stroke="#2c1f14" stroke-width="5" stroke-linecap="round"/>
${ph==="idle"&&G.pt?`<circle cx="${f.x}" cy="${f.y}" r="8" fill="none" stroke="#fff" stroke-dasharray="3 3"/>`:""}
<path id="ln" d="M236 40L${f.x} ${f.y}" stroke="#fffc" stroke-width="1" ${ph==="idle"?'opacity="0"':""}/>
<g transform="translate(${f.x} ${f.y})"${fl}><ellipse rx="14" ry="4" fill="none" stroke="#fff" stroke-opacity=".5"/><g class="fb ${ph==="bite"?"dip":ph==="wait"?"on":""}"><circle cy="-6" r="5" fill="#e33"/><circle cy="-1" r="3" fill="#fff"/></g></g>
<g id="fm" transform="translate(${f.x} ${f.y})"${ph==="fight"?"":' opacity="0"'}><ellipse rx="11" ry="4" fill="#0a1a1f"/><path d="M10 0l7-4v8z" fill="#0a1a1f"/></g>${n?'<rect width="360" height="250" fill="#001230" opacity=".42"/>':""}</svg>${e.rain?'<div class="rain"></div>':""}`}
const V={
fish(){const L=LOC[S.loc],e=env(),B=BT[S.eq.b],c=compat(),fg=G.ph==="fight",d=G.pt?dep(S.loc,G.pt.x,G.pt.y):null;
 const bl=Object.keys(BT).filter(b=>S.bt[b]).map(b=>`<option value="${b}" ${S.eq.b===b?"selected":""}>${BT[b].n} (${BT[b].nat?S.bt[b]+" шт":"многоразовая"})</option>`).join("");
 const lab={idle:"Заброс",wait:"Смотать",bite:"Подсечка!",fight:'<span id="sg">Тяни</span>'}[G.ph];
 const sl=(h,t,v)=>`<div class="slot">${h}<span>${t}</span><b>${v}</b></div>`,r=eqi("r"),cc=eqi("c"),ln=eqi("l"),hk=eqi("h");
 return `<div class="stage">${stage(L,e)}<div class="tag l">${L.n}<small>${e.night?"НОЧЬ":"ДЕНЬ"} · ${e.w.toUpperCase()}${L.cur?" · ТЕЧЕНИЕ":""}</small></div>${G.note?`<div class="note ${G.note.k}">${G.note.m}</div>`:""}<button class="tag r" onclick="openMap()">КАРТА<small>${d?d+" м · "+zone(d):"выбери точку"}</small></button></div>
 <div class="fg ${fg?"":"idl"}"><div class="fr"><span>НАТЯЖЕНИЕ</span><div class="bar zbar"><i id="ten"></i></div><em id="tl">0%</em></div><div class="fr"><span>ВЫВАЖИВАНИЕ</span><div class="bar"><i id="prg"></i></div><em id="pl">0%</em></div><div class="fr"><span>УСТАЛОСТЬ</span><div class="bar"><i id="tir" style="background:#6fb3d9"></i></div><em id="tr">0%</em></div>
 <div id="st"></div>${G.ph==="bite"?`<div class="gz"><span class="zn" style="left:${G.sw[0]*100}%;width:${(G.sw[1]-G.sw[0])*100}%"></span><i class="mk" id="mk"></i></div>`:""}<div id="msg" class="mu">${G.msg}</div></div>
 <div class="rig">${sl(ico(r),"Удилище",r.s.pow+" кг")}${sl(ico(cc),"Катушка","до "+cc.s.cap)}${sl(ico(ln),"Леска",ln.s.str+" кг")}${sl(ico(hk),"Крючок","до "+hk.s.max)}${sl(bico(S.eq.b),"Приманка",B.nat?S.bt[S.eq.b]+" шт":"∞")}</div>
 ${G.ph==="idle"?`<select id="bsel" style="margin-bottom:8px" onchange="equip('b',this.value)">${bl||'<option>нет приманок</option>'}</select>`:""}${c?`<div class="card dn">${c}</div>`:""}
 <button class="btn w" id="big">${lab}</button>
 ${G.mapOpen&&G.ph==="idle"?`<div class="sheet"><div class="chart"><canvas id="map"></canvas><div class="legend"><span>0 м</span><i></i><span>8+ м</span></div><div id="pinfo"></div><button class="btn w" style="margin-top:8px" onclick="G.mapOpen=0;render()">${G.pt?"Готово — к воде":"Закрыть"}</button></div></div>`:""}`},
loc(){return Object.keys(LOC).map(id=>{const L=LOC[id],u=S.ul[id];return `<div class="card" style="border-left:6px solid ${L.sk[2]}"><div class="row"><b>${L.n}</b>${S.loc===id?'<span class="up">Здесь</span>':""}</div><div class="mu">${L.d}</div><div style="margin:6px 0">${Object.keys(L.pool).map(f=>`<span class="chip">${FISH[f].n}</span>`).join("")}</div><div class="mu">Советуем: ${L.rec}</div><div class="row" style="margin-top:8px"><span class="mu">Ур. ${L.lv}${L.cost?" · "+L.cost:""}</span><button class="btn" onclick="openLoc('${id}')" ${S.loc===id?"disabled":""}>${u?"Выбрать":"Открыть"}</button></div></div>`}).join("")},
gear(){return Object.keys(TN).map(t=>`<h3>${TN[t]}</h3>`+Object.values(I).filter(i=>i.t===t&&S.own[i.id]).map(i=>itemCard(i,"gear")).join("")).join("")+`<h3>Приманки</h3>`+Object.keys(BT).filter(b=>S.bt[b]).map(b=>`<div class="card"><div class="it">${bico(b)}<div style="flex:1"><div class="row"><b>${BT[b].n}</b><span class="mu">${BT[b].nat?S.bt[b]+" шт":"многоразовая"}</span></div><div class="mu">Любят: ${Object.keys(BT[b].a).filter(f=>BT[b].a[f]>=1.5).map(f=>FISH[f].n).join(", ")}</div></div></div><div class="row" style="margin-top:6px"><span></span>${S.eq.b===b?'<span class="up">Выбрана</span>':`<button class="btn s" onclick="equip('b','${b}')">Выбрать</button>`}</div></div>`).join("")},
shop(){const cs=[...Object.keys(TN),"n","a"],cn={...TN,n:"Наживки",a:"Приманки"};
 let h=cs.map(c=>`<span class="chip ${cat===c?"on":""}" onclick="cat='${c}';render()" style="padding:8px 12px">${cn[c]}</span>`).join("");
 if(TN[cat])h+=Object.values(I).filter(i=>i.t===cat).map(i=>itemCard(i,"shop")).join("");
 else h+=Object.keys(BT).filter(b=>!!BT[b].nat===(cat==="n")).map(b=>{const x=BT[b];return `<div class="card"><div class="it">${bico(b)}<div style="flex:1"><div class="row"><b>${x.n}</b><span class="mu">${M(x.p)}${x.nat?" / "+x.pack+" шт":""}</span></div><div class="mu">Любят: ${Object.keys(x.a).filter(f=>x.a[f]>=1.5).map(f=>FISH[f].n).join(", ")}</div></div></div><div class="row" style="margin-top:6px"><span class="mu">Ур. ${x.lv} · есть: ${x.nat?(S.bt[b]||0):(S.bt[b]?"да":"нет")}</span><button class="btn" onclick="buyB('${b}')" ${S.lv<x.lv||S.m<x.p?"disabled":""}>Купить</button></div></div>`}).join("");
 return h},
net(){const n=S.net,s=S.store;let h=`<div class="card row"><span>Садок ${n.length}/${CFG.netCap}</span><button class="btn s" onclick="appraise()" ${n.length+s.length?"":"disabled"}>Оценить улов</button></div>`;
 if(n.length){const st=S.sel.reduce((a,i)=>{const c=n.concat(s).find(x=>x.id===i);return a+(c&&c.ap?price(c):0)},0);h+=`<div class="row" style="margin-bottom:10px"><button class="btn s" style="flex:1" onclick="sell(S.sel)" ${S.sel.length?"":"disabled"}>Продать выбранные${st?" ("+st+")":""}</button><button class="btn" style="flex:1" onclick="sell(S.net.map(c=>c.id))">Продать садок</button></div>`+n.map(c=>`<div class="card row" onclick="tsel(${c.id})"><span><i class="ck ${S.sel.includes(c.id)?"on":""}"></i> ${fr(c)}</span><span>${pv(c)}</span></div>`).join("")}else h+=`<div class="card">Садок пуст.</div>`;
 h+=`<h3>Личное хранилище ${s.length}/${CFG.storeCap}</h3>`+(s.length?s.map(c=>`<div class="card"><div class="row"><span>${fr(c)}</span><span>${pv(c)}</span></div><div class="row" style="margin-top:6px"><button class="btn s" onclick="toNet2(${c.id})">В садок</button><button class="btn s" onclick="sell([${c.id}])">Продать</button></div></div>`).join(""):`<div class="card mu">Пусто. Сюда попадает рыба по кнопке «Забрать».</div>`);return h},
quest(){return QS.map(q=>{const g=Math.min(q.need,q.g(S)),d=S.q[q.id];return `<div class="card"><div class="row"><b>${q.n}</b><span class="mu">${M(q.rw)}</span></div><div class="mu">${q.d} (${g}/${q.need})</div><div class="bar" style="margin:6px 0"><i style="width:${g/q.need*100}%"></i></div>${d?'<span class="up">Получено</span>':`<button class="btn" onclick="claim('${q.id}')" ${g<q.need?"disabled":""}>Забрать награду</button>`}</div>`}).join("")},
prof(){const s=S.st,lt=[];for(let l=1;l<=20;l++){const u=Object.values(I).filter(i=>i.lv===l+1).map(i=>i.n).concat(Object.values(LOC).filter(x=>x.lv===l+1).map(x=>x.n));lt.push(`<div class="row mu"><span>${l}→${l+1}: ${CFG.xpNeed(l)} оп.</span><span>+${CFG.lvRw(l+1)}${u.length?" · "+u.join(", "):""}</span></div>`)}
 return `<div class="card"><h3>${NAME}</h3><div>Уровень ${S.lv} · опыт ${S.xp}/${CFG.xpNeed(S.lv)}</div><div class="bar" style="margin:6px 0"><i style="width:${S.xp/CFG.xpNeed(S.lv)*100}%"></i></div></div>
 <div class="card"><div>Баланс: ${M(S.m)}</div><div>Поймано рыб: ${s.c}</div><div>Общий вес: ${s.kg} кг</div><div>Самая тяжёлая: ${s.top} кг</div><div>Продано на: ${M(s.sold)}</div><div>Видов поймано: ${Object.keys(S.dex).length}/${Object.keys(FISH).length}</div></div>
 <div class="card"><h3>Таблица уровней</h3>${lt.join("")}</div>
 <div class="card mu">Сохранение: только на этом устройстве (localStorage), без сервера и без переноса. Платежи: ${PAY.enabled?"включены":"не подключены"}.</div>
 <button class="btn s w" onclick="if(confirm('Удалить весь прогресс?')){localStorage.removeItem(KEY);S=def();G.pt=null;render()}">Сбросить прогресс</button>`}};
function tsel(id){const i=S.sel.indexOf(id);i<0?S.sel.push(id):S.sel.splice(i,1);render()}
function unlocks(l){const u=[];Object.values(I).filter(i=>i.lv===l&&l>1).forEach(i=>u.push("Снасть: "+i.n));Object.values(BT).filter(b=>b.lv===l&&l>1).forEach(b=>u.push("Приманка: "+b.n));Object.values(LOC).filter(x=>x.lv===l&&l>1).forEach(x=>u.push("Водоём: "+x.n));QS.filter(q=>q.ul===l).forEach(q=>u.push("Задание: "+q.n+" можно завершить"));return u}
function lvOk(){if(S.lq.length)S.lq.shift();save();render()}
function lvModal(){const l=S.lq[0];if(!l)return"";const u=unlocks(l);return `<div class="mod"><div class="mc" style="border-color:var(--ac)"><div class="mb" style="color:var(--ac)">Новый уровень!</div><div class="lvn">${l}</div><p>Поздравляем! Ты стал опытнее: награда за уровень ${M(CFG.lvRw(l))}.</p><ul>${u.length?u.map(x=>`<li>${x}</li>`).join(""):`<li class="mu">Новых возможностей на этом уровне нет. До уровня ${l+1} нужно ${CFG.xpNeed(l)} опыта.</li>`}</ul><button class="btn w" onclick="lvOk()">Продолжить</button></div></div>`}
function modal(){const c=S.pend;if(!c)return lvModal();const F=FISH[c.f],ct=c.cat!=null?c.cat:catOf(c.f,c.w),sc=[.8,1,1.2][ct],col=["#7fb6c9","#d9a441","#e8704a"][ct];
 return `<div class="mod"><div class="mc" style="border-color:${col}"><div class="mb" style="color:${col}">${CN[ct]} особь · ${RL[F.r]}</div><div style="transform:scale(${sc});margin:8px 0">${fishSVG(c.f)}</div><h2>${F.n}</h2><div class="big">${c.w} кг · ${c.len} см</div><p class="mu" style="margin:6px 0">${FX[c.f][8]}</p><p class="mu" style="margin-bottom:10px">${LOC[c.loc].n}, глубина ${c.dep} м</p>${G.full?`<div class="dn" style="margin-bottom:8px">Садок полон (${S.net.length}/${CFG.netCap}). Забери рыбу в хранилище или отпусти.</div>`:""}<div class="row"><button class="btn s" style="flex:1" onclick="take()">Забрать</button><button class="btn" style="flex:1" onclick="toNet()">В садок ${S.net.length}/${CFG.netCap}</button></div>${G.full?'<button class="btn s w" style="margin-top:8px" onclick="rel()">Отпустить</button>':""}</div></div>`}
function render(){fixBait();
 $("#top").innerHTML=`<div class="row"><b class="logo">FISHING WORLD</b><b>${M(S.m)}</b></div><div class="row mu"><span>Ур. ${S.lv}</span><span>${S.xp}/${CFG.xpNeed(S.lv)}</span></div><div class="bar"><i style="width:${S.xp/CFG.xpNeed(S.lv)*100}%"></i></div>`;
 $("#nav").innerHTML=TABS.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${NI[t[0]]}</svg>${t[1]}</button>`).join("");
 const m=$("#main"),sc=m.scrollTop;m.innerHTML=V[tab]();m.scrollTop=sc;$("#modal").innerHTML=modal();
 if(tab==="fish"){const b=$("#big");const dn=e=>{e.preventDefault();if(S.pend)return;if(G.ph==="idle")cast();else if(G.ph==="wait")early();else if(G.ph==="bite")strike();else if(G.ph==="fight")G.held=true},up=()=>{G.held=false};
  b.onpointerdown=dn;b.onpointerup=up;b.onpointercancel=up;b.onpointerleave=up;b.oncontextmenu=e=>e.preventDefault();
  const cv=$("#map");if(cv){drawMap();pinfo();cv.onpointerdown=e=>{if(G.ph!=="idle")return toast("Сначала закончи рыбалку.");const r=cv.getBoundingClientRect();const p={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};if(land(S.loc,p.x,p.y))return toast("Это берег.");G.pt=p;drawMap();pinfo()}}}}
render();
window.addEventListener("resize",()=>{if(tab==="fish")drawMap()});
</script></body></html>
